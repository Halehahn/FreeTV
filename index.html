async function unpack(){const bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();return JSON.parse(text)}
let data=[],active='Toutes',activeLanguage='Toutes';const q=document.getElementById('q'),list=document.getElementById('list'),count=document.getElementById('count'),category=document.getElementById('category'),language=document.getElementById('language'),languageBox=document.getElementById('languageBox');const univers=['Toutes','TNT / Généralistes','VOD','Cinéma / Séries','Sport','Jeunesse','Divertissement','Informations','Musique','Locales / Régionales','Étrangères','UHD / HDR'];
function languagePack(x){if(x.univers!=='Étrangères')return'';const n=+x.numero;if((n>=1011&&n<=1152)||(n>=1374&&n<=1483))return'Arabe';if(n>=1160&&n<=1297)return'Afrique / Français';if(n>=1328&&n<=1367)return'Turc';if(n>=1523&&n<=1534)return'Espagnol';if(n>=1555&&n<=1575)return'Allemand';if(n>=1592&&n<=1611)return'Portugais';if(n>=1627&&n<=1641)return'Italien';if(n===1660)return'Grec';if(n>=1668&&n<=1696)return'Russe / Europe de l’Est';if(n>=1706&&n<=1714)return'Arménien';if(n>=1720&&n<=1723)return'Serbe';if(n>=1780&&n<=1785)return'Polonais';if(n>=1790&&n<=1798)return'Ukrainien / Europe de l’Est';if(n===1802)return'Roumain';if(n>=1876&&n<=1895)return'Chinois';if(n===1906||n===1910)return'Coréen';if(n===1914)return'Japonais';if(n>=1918&&n<=1938)return'Indien / Asie du Sud';if(n>=1949&&n<=1950)return'Pakistanais';if(n>=1963&&n<=1978)return'Espagnol / Amérique latine';return'Autres'}
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function drawMenus(){category.innerHTML='';univers.forEach(u=>{const o=document.createElement('option');o.value=u;o.textContent=u;category.appendChild(o)});category.value=active;const langs=['Toutes',...new Set(data.filter(x=>x.univers==='Étrangères').map(x=>x.langue).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));language.innerHTML='';langs.forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=l;language.appendChild(o)});if(!langs.includes(activeLanguage))activeLanguage='Toutes';language.value=activeLanguage;languageBox.classList.toggle('hidden',active!=='Étrangères')}
function render(){const s=norm(q.value.trim());let rows=data.filter(x=>active==='Toutes'||x.univers===active).filter(x=>active!=='Étrangères'||activeLanguage==='Toutes'||x.langue===activeLanguage).filter(x=>!s||String(x.numero).startsWith(s)||norm(x.nom).includes(s)||norm(x.univers).includes(s)||norm(x.zone||'').includes(s)||norm(x.langue||'').includes(s));rows.sort((a,b)=>{if(s){const an=String(a.numero)===s?0:norm(a.nom).startsWith(s)?1:String(a.numero).startsWith(s)?2:3,bn=String(b.numero)===s?0:norm(b.nom).startsWith(s)?1:String(b.numero).startsWith(s)?2:3;if(an!==bn)return an-bn}return a.numero-b.numero});count.textContent=rows.length+' résultat'+(rows.length>1?'s':'');list.innerHTML='';if(!rows.length){list.innerHTML='<div class="empty">Aucune chaîne trouvée.</div>';return}rows.slice(0,150).forEach(x=>{const r=document.createElement('article');r.className='row';r.innerHTML=`<div class="num">${x.numero}</div><div><div class="name"></div><div class="sub"></div></div><button class="copy">Copier</button>`;r.querySelector('.name').textContent=x.nom;let sub=x.univers;if(x.univers==='Étrangères'&&x.langue)sub+=' · '+x.langue;if(x.zone)sub+=' · '+x.zone;r.querySelector('.sub').textContent=sub;r.querySelector('.copy').onclick=async e=>{try{await navigator.clipboard.writeText(String(x.numero))}catch{const t=document.createElement('textarea');t.value=String(x.numero);document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}e.currentTarget.textContent='Copié ✓';setTimeout(()=>e.currentTarget.textContent='Copier',1100)};list.appendChild(r)});if(rows.length>150){const e=document.createElement('div');e.className='empty';e.textContent='Affinez votre recherche pour voir les autres résultats.';list.appendChild(e)}}
category.onchange=()=>{active=category.value;if(active!=='Étrangères')activeLanguage='Toutes';drawMenus();render()};language.onchange=()=>{activeLanguage=language.value;render()};q.oninput=render;
unpack().then(d=>{data=d.map(x=>({...x,langue:languagePack(x)}));drawMenus();render()}).catch(e=>{list.innerHTML='<div class="empty">Erreur de chargement des données.</div>';console.error(e)})
</script></body></html>
